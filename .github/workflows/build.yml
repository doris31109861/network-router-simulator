# 每次 push 都在 Ubuntu 上編譯並實際跑一次模擬，確認程式可以編譯與執行
name: build-and-run

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run p1p2 simulation
        run: make run RUN_SECS=20

      # 用命令列參數換 port 與封包數再跑一次，確認參數有作用（10 個 TCP ACK）
      - name: Run p1p2 with custom args
        run: |
          mkdir -p logs/args && make run ARGS="-n 10 -p 9100" RUN_SECS=15 LOGS=logs/args
          test "$(grep -c 'TCP ACK' logs/args/p1p2-client.log)" -eq 10

      - name: Run p2-throughput simulation
        run: make run-p2 RUN_SECS=20

      - name: Show output
        run: tail -n 15 logs/*.log

      # 把 p1p2 的 log 整理成 CSV 並畫圖
      - name: Plot results
        run: |
          pip install matplotlib
          python3 scripts/plot_results.py

      # 保留執行紀錄與圖表，可從 Actions 頁面下載
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            logs/*.log
            results/
